[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-nnx"
version = "0.1.0"
description = "PPO on ProcGen in JAX/Flax NNX, with a ResNet baseline and a VAE-encoder variant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.35",
    "flax>=0.11.0",
    "optax>=0.2.3",
    "distrax>=0.1.5",
    "einops>=0.8.0",
    "chex>=0.1.86",
    "numpy>=1.26",
    "pillow>=10.0",
    "tqdm>=4.66",
    "orbax-checkpoint>=0.11.0",
    "wandb>=0.17",
]

[project.optional-dependencies]
envs = [
    "gym==0.26.2",
    "procgen>=0.10.7",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.17.1",
]

[tool.setuptools]
packages = ["ppo_cleanrl", "ppo_vae", "shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: tests that build full agents and run a training step",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", ".uvcache", ".uvpython", "*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
]
ignore = [
    "E501",  # long lines are handled by the formatter
    "E741",  # ambiguous variable names (l/I/O) appear in the RL math
    "B008",  # function calls as defaults are used by chex.dataclass configs
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
