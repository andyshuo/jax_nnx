name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runners have no accelerator: force JAX onto CPU.
  JAX_PLATFORMS: cpu

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true

      - run: pixi run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true

      - name: Show JAX backend
        run: pixi run python -c "import jax; print('jax', jax.__version__); print(jax.devices())"

      - run: pixi run test

  smoke:
    name: Entrypoint smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true

      - name: Build agent/optimizer for every variant (no GPU, no wandb)
        run: |
          for cfg in cleanrl vae; do
            pixi run python main.py --config "$cfg" --dry-run --logdir "$RUNNER_TEMP/logs"
          done
